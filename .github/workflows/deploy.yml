name: Build and Deploy Spara

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-progress

      - name: Check TypeScript
        run: npm run lint

      - name: Build production website
        run: npm run build
        env:
          GITHUB_ACTIONS: 'true'

      - name: Verify and prepare website files
        run: |
          set -eu
          test -s dist/index.html
          test -d dist/assets
          touch dist/.nojekyll
          echo "Website files are ready:"
          find dist -maxdepth 2 -type f | sort | head -80

      - name: Upload website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish website
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
